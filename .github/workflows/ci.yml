name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch (pin 2.3.1, CPU build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src/ssm_phylo tests

      - name: Pytest (CPU, no mamba-ssm, no network)
        env:
          HF_HUB_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest tests/ -x -q

      - name: V1 end-to-end smoke (quick)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: bash scripts/run_v1_smoke.sh --quick
