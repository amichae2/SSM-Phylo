[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssm-phylo"
version = "0.1.0"
description = "SSM distance estimator for phylogenetic trees from unaligned sequences (from-scratch Mamba encoder + task head)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Floor pins on purpose: this project is a from-scratch Mamba + head model and
# runs on Colab, which ships newer torch/transformers/numpy. Strict pins would
# force a multi-GB torch/numpy downgrade on every fresh VM. The pipeline runs
# on transformers' EAGER Mamba (MambaForCausalLM, transformers>=5) — no CUDA
# compile needed.
dependencies = [
    "torch>=2.1",
    "transformers>=5.0",
    "numpy>=1.24",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "biopython",
    "dendropy",
    "tqdm",
    "PyYAML",
    "wandb",
    "tensorboard",
]

[project.optional-dependencies]
# Speed extras — HuggingFace's `kernels` fused kernels (fast wheels, safe
# anytime; transformers 5.x auto-detects them) and `mambapy` (mamba.py
# pure-PyTorch parallel-scan backend, no compiled kernels). NEVER required:
# the pipeline runs fully on the eager Mamba fallback, and the old fused-kernel
# package is obsolete (does not build on modern torch). colab_setup.sh installs
# both non-fatally.
cuda = [
    "kernels",
    "mambapy",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
ssm-phylo = "ssm_phylo.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ssm_phylo" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
