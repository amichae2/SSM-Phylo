[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssm-phylo"
version = "0.1.0"
description = "SSM distance estimator for phylogenetic trees from unaligned sequences (from-scratch Mamba encoder + task head)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Floor pins on purpose: this project is a from-scratch Mamba + head model and
# runs on Colab, which ships newer torch/transformers/numpy. Strict pins would
# force a multi-GB torch/numpy downgrade on every fresh VM. The pipeline runs
# on transformers' EAGER Mamba (MambaForCausalLM) — no CUDA compile needed.
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "numpy>=1.24",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "biopython",
    "dendropy",
    "tqdm",
    "PyYAML",
    "wandb",
    "tensorboard",
]

[project.optional-dependencies]
# Fused-kernel extras — ONLY for the optional mamba-ssm speedup, NEVER required.
# The pipeline must run fully on the eager Mamba fallback. mamba-ssm==2.1.0 is
# pinned to the last version that builds from source; it requires an exact
# old-torch environment (torch 2.3.x era) and fails to build on modern Colab
# (torch >= 2.11). Do NOT install this extra in the Colab setup script; it is
# opt-in via SSM_PHYLO_TRY_MAMBA=1 for bespoke environments only.
cuda = [
    "causal-conv1d",
    "mamba-ssm==2.1.0",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
ssm-phylo = "ssm_phylo.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ssm_phylo" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
